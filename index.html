<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVRK Timer</title>
<style>
  :root{--ink:#111;--paper:#fff;--gray:#8a8a8a;--line:#e3e3e3;--off:#ececec;}
  body.inv{--ink:#f4f1e8;--paper:#0d0d0f;--gray:#777;--line:#2a2a2e;--off:#1d1d21;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo",sans-serif;
       overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:7px 11px;cursor:pointer;border-radius:0;line-height:1.2;}
  button:hover,button.on{background:var(--ink);color:var(--paper);}
  button.ghost{border-color:var(--line);color:var(--gray);} button.ghost:hover{border-color:var(--ink);color:var(--ink);background:var(--paper);}
  button.ghost.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px;transition:opacity .4s;}
  header img{height:20px;display:block;}
  body.inv header img{filter:invert(1);}
  .grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px;}

  #stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;}
  #gfx{flex:none;position:relative;}
  #cv{position:absolute;inset:0;width:100%;height:100%;}
  #time{flex:none;display:flex;align-items:center;user-select:none;}
  .u{position:relative;display:flex;align-items:center;}
  .u svg,.col svg{display:block;}
  .arr{position:absolute;left:50%;transform:translateX(-50%);background:none;border:0;color:var(--gray);padding:6px 14px;cursor:pointer;}
  .arr:hover{background:none;color:var(--ink);}
  .arr svg{display:block;width:100%;height:100%;}
  .arr.up{bottom:100%;} .arr.dn{top:100%;}
  body.run .arr{visibility:hidden;}
  .on-seg{fill:var(--ink);} .off-seg{fill:var(--off);}
  .txt{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1;}
  body.blink .col{animation:bk 1s steps(1) infinite;}
  body.done #time .u, body.done #time .col{animation:bk .5s steps(1) infinite;}
  @keyframes bk{50%{opacity:0;}}
  #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--gray);transition:opacity .4s;}

  footer{padding:14px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .4s;}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .set{display:flex;align-items:center;gap:4px;font-size:13px;}
  .set input{width:64px;font:inherit;font-size:20px;font-weight:700;text-align:center;padding:5px 4px;border:1px solid var(--ink);
             background:var(--paper);color:var(--ink);border-radius:0;font-variant-numeric:tabular-nums;}
  .set span{margin-right:8px;color:var(--gray);}
  #go{min-width:96px;font-weight:700;}
  body.run.idle-ui header, body.run.idle-ui footer, body.run.idle-ui #hint{opacity:0;}
  body.run.idle-ui{cursor:none;}
  body.run .set, body.run #presets{display:none;}
</style>
</head>

// 로고 원본(348×341) 안의 링 중심
const CX = 174.5, CY = 170.6, GHOST = 0.07;
const img = new Image(); img.src = SYMBOL;
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), timeEl = $('#time');
const st = { total: 600, left: 600, end: 0, running: false, done: false, layout: 'ring', num: 'seg', sound: true };
try { const s = JSON.parse(localStorage.getItem('mvrk-timer2') || '{}');
      if (s.layout) st.layout = s.layout; if (s.num) st.num = s.num; if (s.sound === false) st.sound = false;
      if (s.inv) document.body.classList.add('inv'); } catch (e) {}
const save = () => { try { localStorage.setItem('mvrk-timer2', JSON.stringify({layout: st.layout, num: st.num, sound: st.sound, inv: document.body.classList.contains('inv')})); } catch (e) {} };

// ---------- 시간 ----------
function readInput() {
  const m = Math.max(0, Math.min(999, parseInt($('#mm').value) || 0));
  const s = Math.max(0, Math.min(59, parseInt($('#ss').value) || 0));
  return m * 60 + s;
}
function setTotal(sec) {
  st.total = st.left = Math.max(1, Math.min(999 * 60 + 59, sec)); st.done = false; st.running = false;
  $('#mm').value = Math.floor(st.total / 60); $('#ss').value = String(st.total % 60).padStart(2, '0');
  sync();
}
const shown = () => Math.max(0, Math.ceil(st.left - 1e-6));
function start() {
  if (st.done || st.left <= 0) setTotal(readInput());
  st.end = performance.now() + st.left * 1000; st.running = true; unlockAudio(); sync(); poke();
}
function pause() { st.left = (st.end - performance.now()) / 1000; st.running = false; sync(); }
function toggle() { st.running ? pause() : start(); }
function reset() { setTotal(readInput()); }
function plusMin() {
  if (st.done) { st.done = false; st.left = 0; st.total = 0; }
  st.left += 60; st.total += 60; if (st.running) st.end += 60000; sync();
}
function nudge(unit, dir) {   // 숫자 위아래 화살표: 분 ±1, 초 ±10
  if (st.running) return;
  const step = unit === 'm' ? 60 : 10;
  setTotal(Math.max(10, shown() + dir * step));
}
function finish() { st.running = false; st.left = 0; st.done = true; beep(); sync(); }

function sync() {
  const b = document.body.classList;
  b.toggle('run', st.running); b.toggle('done', st.done);
  b.toggle('blink', !st.running && !st.done && st.left < st.total);
  $('#go').textContent = st.running ? '멈춤' : (st.left < st.total && !st.done ? '이어서' : '시작');
    document.querySelectorAll('[data-num]').forEach(x => x.classList.toggle('on', x.dataset.num === st.num));
  $('#snd').textContent = st.sound ? '소리 켬' : '소리 끔';
  $('#inv').classList.toggle('on', b.contains('inv'));
  layout();
}

// ---------- 소리 ----------
let ac = null;
function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} }
function beep() {
  if (!st.sound || !ac) return;
  const t0 = ac.currentTime;
  [0, .28, .56, 1.2, 1.48, 1.76].forEach(d => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 880;
    g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.12, t0 + d + .01); g.gain.linearRampToValueAtTime(0, t0 + d + .18);
    o.connect(g).connect(ac.destination); o.start(t0 + d); o.stop(t0 + d + .2);
  });
}

// ---------- 디지털 숫자 (7세그먼트) ----------
const SW = 60, SH = 110, T = 11, G = 1.6, SK = 8;           // 칸 너비·높이·두께·틈·기울기(°)
const hz = (cy, x1, x2) => [[x1, cy], [x1 + T / 2, cy - T / 2], [x2 - T / 2, cy - T / 2], [x2, cy], [x2 - T / 2, cy + T / 2], [x1 + T / 2, cy + T / 2]];
const vt = (cx, y1, y2) => [[cx, y1], [cx + T / 2, y1 + T / 2], [cx + T / 2, y2 - T / 2], [cx, y2], [cx - T / 2, y2 - T / 2], [cx - T / 2, y1 + T / 2]];
const SEG = {
  a: hz(T / 2, T / 2 + G, SW - T / 2 - G), g: hz(SH / 2, T / 2 + G, SW - T / 2 - G), d: hz(SH - T / 2, T / 2 + G, SW - T / 2 - G),
  f: vt(T / 2, T / 2 + G, SH / 2 - G), b: vt(SW - T / 2, T / 2 + G, SH / 2 - G),
  e: vt(T / 2, SH / 2 + G, SH - T / 2 - G), c: vt(SW - T / 2, SH / 2 + G, SH - T / 2 - G)
};
const DIG = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
const SKX = Math.tan(SK * Math.PI / 180) * SH, VBW = SW + SKX + 10, VBH = SH + 6;
const poly = (pts, cls, dx = 0, dy = 0) => `<polygon class="${cls}" points="${pts.map(p => (p[0] + dx).toFixed(2) + ',' + (p[1] + dy).toFixed(2)).join(' ')}"/>`;
function digitSVG(n, h) {
  const on = DIG[n]; let base = '';
  for (const k in SEG) {
    if (on.includes(k)) base += poly(SEG[k], 'on-seg');
    else base += poly(SEG[k], 'off-seg');
  }
  return `<svg width="${h * VBW / VBH}" height="${h}" viewBox="-5 -1 ${VBW} ${VBH}"><g transform="translate(${SKX},0) skewX(${-SK})">${base}</g></svg>`;
}
const CW = T * 1.15 + 34;
function colonSVG(h) {
  const s = T * 1.15, sq = y => {
    const x = 17 + SKX * (1 - (y + s / 2) / SH);        // 숫자 기울기에 맞춰 밀기
    return `<rect class="on-seg" x="${x}" y="${y}" width="${s}" height="${s}"/>`;
  };
  return `<svg width="${h * CW / VBH}" height="${h}" viewBox="0 -1 ${CW} ${VBH}">${sq(SH * 0.3 - s / 2)}${sq(SH * 0.7 - s / 2)}</svg>`;
}
const ARR = d => `<svg viewBox="0 0 24 14"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let lastKey = '', DH = 120;
function renderTime() {
  const t = shown(), m = String(Math.floor(t / 60)).padStart(2, '0'), s = String(t % 60).padStart(2, '0');
  const key = m + s + st.num + DH;
  if (key === lastKey) return; lastKey = key;
  const aw = Math.max(28, DH * 0.24), ah = aw * 0.6;
  const arrows = u => `<button class="arr up" data-u="${u}" data-d="1" style="width:${aw}px;height:${ah + 12}px;margin-bottom:${DH * 0.08}px" aria-label="늘리기">${ARR('M3 11 L12 3 L21 11')}</button>`
                    + `<button class="arr dn" data-u="${u}" data-d="-1" style="width:${aw}px;height:${ah + 12}px;margin-top:${DH * 0.08}px" aria-label="줄이기">${ARR('M3 3 L12 11 L21 3')}</button>`;
  if (st.num === 'seg') {
    const grp = str => [...str].map(c => digitSVG(+c, DH)).join('');
    timeEl.innerHTML = `<div class="u">${grp(m)}${arrows('m')}</div><div class="col">${colonSVG(DH)}</div><div class="u">${grp(s)}${arrows('s')}</div>`;
  } else {
    const fs = DH * 1.32;
    timeEl.innerHTML = `<div class="u txt" style="font-size:${fs}px">${m}${arrows('m')}</div><div class="col txt" style="font-size:${fs}px;transform:translateY(-.06em)">:</div><div class="u txt" style="font-size:${fs}px">${s}${arrows('s')}</div>`;
  }
}
// 화살표: 누르고 있으면 계속
let holdT;
timeEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.arr'); if (!b) return;
  e.preventDefault();
  const go = () => nudge(b.dataset.u, +b.dataset.d);
  go(); let wait = 380;
  const rep = () => { holdT = setTimeout(() => { go(); wait = Math.max(60, wait * 0.8); rep(); }, wait); }; rep();
});
['pointerup', 'pointercancel'].forEach(ev => addEventListener(ev, () => clearTimeout(holdT)));

// ---------- 배치: 왼쪽 그래픽 · 오른쪽 숫자 (세로 화면이면 위아래) ----------
let W = 0, H = 0, DPR = 1, GS = 0;
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = $('#stage').getBoundingClientRect(); W = r.width; H = r.height;
  const nd = String(Math.floor(shown() / 60)).padStart(2, '0').length + 2;
  const ratio = (nd * VBW + CW) / VBH;                               // 숫자 묶음 너비 / 높이
  const portrait = W < H * 1.05;
  $('#stage').style.flexDirection = portrait ? 'column' : 'row';
  let gap;
  if (!portrait) {
    GS = Math.min(H * 0.8, W * 0.36); gap = Math.max(24, W * 0.04);
    DH = Math.min((W - GS - gap - 60) / ratio, H * 0.34);
  } else {
    DH = Math.min((W - 40) / ratio, H * 0.16); gap = DH * 0.6;
    GS = Math.min(W * 0.8, H - DH - gap - 120);
  }
  $('#stage').style.gap = gap + 'px';
  const g = $('#gfx'); g.style.width = GS + 'px'; g.style.height = GS + 'px';
  cv.width = GS * DPR; cv.height = GS * DPR;
  lastKey = ''; renderTime();
}

// ---------- 링 시계 ----------
function tile(i) {
  const a = (-90 + 60 * i) * Math.PI / 180, h = Math.PI / 6, L = 400;
  ctx.beginPath(); ctx.moveTo(CX, CY);
  ctx.lineTo(CX + L * Math.cos(a - h), CY + L * Math.sin(a - h));
  ctx.lineTo(CX + L * Math.cos(a + h), CY + L * Math.sin(a + h)); ctx.closePath();
  ctx.save(); ctx.clip(); ctx.drawImage(img, 0, 0); ctx.restore();
}
const progress = () => st.total ? Math.min(1, Math.max(0, 1 - st.left / st.total)) : 0;
let angNow = 0;
function drawRing(now) {
  // 1초에 6°씩 똑딱 (1분에 한 바퀴) + 전체 시간의 1/6마다 한 칸씩 흐려짐
  const el = st.total - Math.max(0, st.left);
  const target = Math.floor(el + 1e-6) * 6 * Math.PI / 180;
  angNow += (target - angNow) * (Math.abs(target - angNow) > 1 ? 1 : 0.3);
  const k = progress() * 6, s = GS / 360;
  ctx.translate(GS / 2, GS / 2); ctx.rotate(angNow); ctx.scale(s, s); ctx.translate(-CX, -CY);
  for (let i = 0; i < 6; i++) {
    let a;
    if (st.done) a = (Math.floor(now / 250) % 6) === i ? 1 : 0.2;
    else if (i < Math.floor(k)) a = GHOST;
    else if (i > Math.floor(k)) a = 1;
    else a = GHOST + (1 - GHOST) * (1 - (k - Math.floor(k)));
    ctx.globalAlpha = a; tile(i);
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  if (st.running) { st.left = (st.end - now) / 1000; if (st.left <= 0) finish(); }
  renderTime();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, GS, GS);
  if (img.complete) drawRing(now);
  requestAnimationFrame(frame);
}

// ---------- 조작 ----------
let idleT;
function poke() {
  document.body.classList.remove('idle-ui'); clearTimeout(idleT);
  idleT = setTimeout(() => st.running && document.body.classList.add('idle-ui'), 2500);
}
addEventListener('mousemove', poke); addEventListener('touchstart', poke);
$('#go').onclick = toggle; $('#reset').onclick = reset; $('#plus').onclick = plusMin;
document.querySelectorAll('[data-min]').forEach(b => b.onclick = () => setTotal(b.dataset.min * 60));
document.querySelectorAll('[data-num]').forEach(b => b.onclick = () => { st.num = b.dataset.num; save(); sync(); });
$('#inv').onclick = () => { document.body.classList.toggle('inv'); save(); sync(); };
$('#snd').onclick = () => { st.sound = !st.sound; save(); sync(); if (st.sound) unlockAudio(); };
const fsToggle = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('#fs').onclick = fsToggle;
['#mm', '#ss'].forEach(s => {
  $(s).addEventListener('input', () => { if (!st.running) { st.total = st.left = Math.max(1, readInput()); st.done = false; sync(); } });
  $(s).addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); start(); } });
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'f' || e.key === 'F') fsToggle();
  poke();
});
addEventListener('resize', layout);

setTotal(600);
// 미리보기용: ?left=250&inv=1&num=txt
const q = new URLSearchParams(location.search);
if (q.get('num')) st.num = q.get('num');
if (q.get('left')) st.left = +q.get('left');
if (q.get('inv')) document.body.classList.add('inv');
sync();
requestAnimationFrame(frame);
</script>
</body>
</html>
